name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      should_release:
        description: Build, sign, and publish a draft release
        required: true
        type: boolean
        default: false
      signing_smoke_test:
        description: Build and sign Windows artifacts without creating a release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: Validate (${{ matrix.check.name }})
    runs-on: ${{ matrix.check.runner }}
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Lint
            command: npm run lint
            runner: ubuntu-latest
          - name: Storybook
            command: npm run build-storybook
            runner: ubuntu-latest
          - name: Tests
            command: npm test
            runner: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache node_modules and native builds
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            node_modules
            .vite
            **/node_modules
            **/*.node
            **/build/Release
          key: ${{ runner.os }}-node-v2-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/binding.gyp', 'src/app/irsdk/native/**/*.c', 'src/app/irsdk/native/**/*.cc', 'src/app/irsdk/native/**/*.cpp', 'src/app/irsdk/native/**/*.h', 'src/app/irsdk/native/**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

      - name: Test Squirrel signing package updates
        if: matrix.check.name == 'Tests'
        shell: pwsh
        run: ./tools/signing/rebuild-squirrel.spec.ps1

      - name: Upload coverage report
        if: matrix.check.name == 'Tests'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

  build:
    name: build
    needs: validation
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Confirm validation passed
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [[ "$VALIDATION_RESULT" != "success" ]]; then
            echo "Validation result: $VALIDATION_RESULT" >&2
            exit 1
          fi

  release-gate:
    name: Determine release eligibility
    if: github.event_name == 'push' || inputs.should_release || inputs.signing_smoke_test
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # Fetch the last 2 commits to compare versions
          persist-credentials: false

      - name: Check release conditions
        id: gate
        shell: bash
        env:
          DISPATCH_SHOULD_RELEASE: ${{ inputs.should_release }}
          DISPATCH_SIGNING_SMOKE_TEST: ${{ inputs.signing_smoke_test }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_SHOULD_RELEASE" == "true" || "$DISPATCH_SIGNING_SMOKE_TEST" == "true" ]]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          currentVersion=$(node -p "require('./package.json').version")
          previousVersion=$(git show HEAD^:package.json | node -e \
            "let input = ''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version));")

          if [[ -z "$currentVersion" || -z "$previousVersion" ]]; then
            echo "Could not determine current and previous package versions." >&2
            exit 1
          fi

          if [[ "$currentVersion" != "$previousVersion" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Version changed from $previousVersion to $currentVersion"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and sign Windows artifacts
    needs: [build, release-gate]
    if: needs.release-gate.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build native iRacing addon
        run: npm run irsdk:build

      # --- Signed release ----------------------------------------------------
      # Pushes release only when the version changes. Manual runs release only
      # when should_release is enabled. signing_smoke_test runs the same signing
      # flow but uploads CI artifacts instead of creating a GitHub release.
      # Pull requests never enter this flow.
      # Flow: package once -> make Squirrel artifacts and save make results ->
      # sign the app and generated launcher together inside the full package ->
      # rebuild RELEASES and Setup.exe -> sign Setup.exe -> release using the
      # saved make results. This uses two SignPath requests.
      # The make manifest stores paths to out/make/... (no content hashing), so
      # replacing the artifacts is picked up by --from-make. Rebuilding from
      # the signed full package keeps the embedded installer payload and the
      # RELEASES checksum consistent for fresh installs and auto-updates.

      - name: Package unsigned Windows application
        run: npx electron-forge package
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

      - name: Verify packaged native iRacing addon
        shell: pwsh
        run: |
          $asarPath = 'out/irdashies-win32-x64/resources/app.asar'
          $builtAddon = 'build/Release/irsdk_node.node'
          $packagedAddon = `
            'out/irdashies-win32-x64/resources/app.asar.unpacked/.vite/build/Release/irsdk_node.node'

          if (-not (Test-Path -LiteralPath $asarPath -PathType Leaf)) {
            throw "Packaged ASAR not found: $asarPath"
          }
          if (-not (Test-Path -LiteralPath $builtAddon -PathType Leaf)) {
            throw "Built native addon not found: $builtAddon"
          }
          if (-not (Test-Path -LiteralPath $packagedAddon -PathType Leaf)) {
            throw "Unpacked native addon not found: $packagedAddon"
          }

          $builtHash = (Get-FileHash -LiteralPath $builtAddon -Algorithm SHA256).Hash
          $packagedHash = `
            (Get-FileHash -LiteralPath $packagedAddon -Algorithm SHA256).Hash
          if ($builtHash -ne $packagedHash) {
            throw "Packaged native addon does not match the freshly built addon. Built: $builtHash; packaged: $packagedHash"
          }

      - name: Build unsigned Squirrel artifacts
        run: npx electron-forge make --from-package

      - name: Prepare Squirrel package for signing
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath out/make-results -PathType Container)) {
            throw 'Electron Forge make results were not generated.'
          }
          $packages = @(Get-ChildItem `
            -LiteralPath out/make/squirrel.windows/x64 -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -notlike '*-full.nupkg') {
            throw 'Expected one full Squirrel package and no delta packages.'
          }
          # A nupkg is a ZIP. Give it a fixed name for the signing configuration;
          # GitHub wraps this file in a second ZIP when uploading the artifact.
          Copy-Item -LiteralPath $packages[0].FullName -Destination squirrel-package.zip

      - name: Upload Squirrel package for signing
        id: upload-squirrel-package
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-squirrel-package
          if-no-files-found: error
          path: squirrel-package.zip

      - name: Sign application and Squirrel launcher
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: irdashies
          signing-policy-slug: release-signing
          artifact-configuration-slug: squirrel-package
          github-artifact-id: ${{ steps.upload-squirrel-package.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-squirrel-package

      - name: Rebuild Squirrel installer from signed package
        shell: pwsh
        run: |
          ./tools/signing/rebuild-squirrel.ps1 `
            -PackageDirectory out/make/squirrel.windows/x64 `
            -SignedPackagePath signed-squirrel-package/squirrel-package.zip

      - name: Upload unsigned installer for signing
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          if-no-files-found: error
          path: out/make/squirrel.windows/x64/*Setup.exe

      - name: Sign installer with SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: irdashies
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Swap in the signed installer
        shell: pwsh
        run: |
          Copy-Item signed-installer/*Setup.exe out/make/squirrel.windows/x64/ -Force
          $installer = Get-ChildItem `
            -Path out/make/squirrel.windows/x64 `
            -Filter '*Setup.exe' `
            -File |
            Select-Object -First 1
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is $($signature.Status): $($signature.StatusMessage)"
          }
          Write-Output "Verified signed installer: $($signature.SignerCertificate.Subject)"

      - name: Upload signed Windows test artifacts
        if: inputs.signing_smoke_test
        uses: actions/upload-artifact@v7
        with:
          name: signed-windows-test-artifacts
          if-no-files-found: error
          path: out/make/squirrel.windows/x64/*

      - name: Publish signed release
        if: inputs.signing_smoke_test != true
        run: npx electron-forge release --from-make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
